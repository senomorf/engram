name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # owner-only: fork and bot PRs get no secrets anyway, skip the wasted runs
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require the review credential
        # Without this the action exits 0 with its internal steps skipped, so a missing
        # secret shows up as a green "review passed" that never looked at anything.
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Mint one with 'claude setup-token'"
            echo "::error::then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}'."
            exit 1
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # 'opus' is an alias for the latest Opus, so this never needs a version bump
          claude_args: '--model opus'
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git blame:*)",
                  "Read",
                  "Glob",
                  "Grep"
                ]
              }
            }

      - name: Confirm the review actually ran
        # claude-code-action exits 0 with its internal steps skipped when it bails, so the
        # check goes green having reviewed nothing. Two known causes: a missing token (the
        # step above catches that), and a PR that edits this workflow, which the action
        # refuses because otherwise a PR could rewrite it to steal the token.
        # `execution_file` is populated only on a real run, so it is the honest signal.
        if: always() && steps.claude-review.conclusion != 'skipped'
        env:
          EXEC: ${{ steps.claude-review.outputs.execution_file }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$EXEC" ]; then
            echo "Review ran: $EXEC"
            exit 0
          fi
          if ! git diff --quiet "$BASE"...HEAD -- .github/workflows/claude-code-review.yml; then
            echo "::warning::No review ran. This PR edits claude-code-review.yml, and the action requires that file to match the base branch. It will review normally once this is merged."
            exit 0
          fi
          echo "::error::The review did not run, and this PR does not modify its workflow."
          echo "::error::Check the token and the 'Run Claude Code Review' step log. A green check here would have been a lie."
          exit 1
